name: Test Build Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Temporary F31 bootstrap: expose npm-generated PUBLIC lockfile chunks in
      # this PR's build log. Remove this step after committing package-lock.json.
      - name: F31 lockfile bootstrap
        if: github.event_name == 'pull_request'
        run: |
          node -e "const fs=require('node:fs');const value=fs.readFileSync('package-lock.json').toString('base64');const size=2200;for(let i=0;i<value.length;i+=size)console.log('F31_LOCK_CHUNK '+Math.floor(i/size)+' '+value.slice(i,i+size));console.log('F31_LOCK_END '+Math.ceil(value.length/size));"
      - run: npm test
      - run: npm run build
        env:
          GITHUB_REPOSITORY: ivan7800/DEAD-ROAD-404
      - run: node scripts/check-pages-build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run benchmark:ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f30-benchmark-json
          path: artifacts/benchmarks/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-capturas
          path: artifacts/
          if-no-files-found: ignore
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
